# WhyNotAC Full Pilot & Observability Stack (Paper 1.21.11 + Velocity + Redis + Prometheus + Grafana)
# Usage:
#   1. Build plugins: ./gradlew :whynotac-paper:jar :whynotac-velocity:jar
#   2. Copy jars into deploy/runtime/paper-plugins/ and deploy/runtime/velocity-plugins/
#   3. Set WHYNOTAC_REDIS_PASSWORD and WHYNOTAC_METRICS_TOKEN in .env (or shell environment)
#   4. docker compose -f deploy/docker-compose.yml up -d
services:
  redis:
    image: redis:7-alpine
    container_name: whynotac-redis
    command: ["redis-server", "--requirepass", "${WHYNOTAC_REDIS_PASSWORD:-change-me-redis-secret}", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${WHYNOTAC_REDIS_PASSWORD:-change-me-redis-secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - whynotac-net

  paper:
    image: itzg/minecraft-server:java21
    container_name: whynotac-paper
    depends_on:
      redis:
        condition: service_healthy
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      ONLINE_MODE: "FALSE"
      MEMORY: "2G"
      ENABLE_RCON: "FALSE"
    volumes:
      - ./runtime/paper-data:/data
      - ./runtime/paper-plugins:/plugins:ro
      - ./configs/paper-velocity-backend/config.yml:/data/plugins/WhyNotAC/config.yml:ro
    ports:
      - "127.0.0.1:9108:9108"
    networks:
      - whynotac-net

  velocity:
    image: itzg/mc-proxy:java21
    container_name: whynotac-velocity
    depends_on:
      - paper
    environment:
      TYPE: "VELOCITY"
      MEMORY: "512M"
    volumes:
      - ./runtime/velocity-data:/server
      - ./runtime/velocity-plugins:/plugins:ro
    ports:
      - "25565:25565"
    networks:
      - whynotac-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: whynotac-prometheus
    depends_on:
      - paper
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - whynotac-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: whynotac-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-change-me-grafana}"
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/whynotac.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - whynotac-net

networks:
  whynotac-net:
    driver: bridge
