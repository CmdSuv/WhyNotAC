# WhyNotAC Pilot — Deterministic Soft Mitigation + Anti-ESP Profile (1.21.11)
# Cancels impossible hits/block actions, sets back impossible movement, hides distant occluded ESP targets,
# and runs non-punitive AI decoy probes — while keeping auto-kick and auto-ban OFF.

recording:
  enabled: true
  max-age-days: 14
  max-total-megabytes: 4096
  max-queued-megabytes: 64

observation:
  edge: true
  per-tick-transactions: true
  flush-transactions: true

cases:
  retention-days: 90

verdict:
  armed-checks:
    - "attack-reach"
    - "attack-aim"
    - "break-time"
    - "use-aim"
    - "movement"
    - "design-probe"
  mitigations: true
  hide-information: true
  auto-kick: false
  auto-ban: false
  second-verifier: true
  require-corroboration-for-ban: true
  temp-ban-hours: 24
  max-enforced-players-per-minute: 5
  max-false-ban-budget: 1
  false-ban-window-days: 7
  correlation-half-life-seconds: 120
  min-score-for-mitigation: 1.0
  min-score-for-kick: 3.0
  ban-wave-delay-seconds: 120

identity:
  trust-auth-plugins: true

observability:
  health-watchdog: true
  metrics-http-port: 9108

network-bridge:
  enabled: false
  secret-file: "network-secret.key"
  max-clock-skew-seconds: 60

ai:
  active-probes:
    enabled: true
    ttl-ticks: 10
