name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: WhyNotAC_Workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run all test suites (unit, Netty, vanilla conformance)
        run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: WhyNotAC_Workspace/**/build/reports/tests/
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: whynotac-paper
          path: WhyNotAC_Workspace/whynotac-paper/build/libs/*.jar
